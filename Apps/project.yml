name: PaseoIOS
options:
  bundleIdPrefix: com.cnaron
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16"
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: 6.0
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: 1
packages:
  PaseoCore:
    path: ..
  PaseoUI:
    path: ..
targets:
  PaseoIOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ../Sources/PaseoIOSApp
    dependencies:
      - package: PaseoCore
        product: PaseoCore
      - package: PaseoUI
        product: PaseoUI
    info:
      path: Apps/PaseoIOS-Info.plist
      properties:
        CFBundleName: Paseo
        CFBundleDisplayName: Paseo
        UILaunchScreen:
          UIColorName: ""
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
